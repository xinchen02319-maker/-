<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简单小工具</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: rgba(255,255,255,.86);
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --main: #2563eb;
      --green: #0f766e;
      --shadow: 0 18px 45px rgba(15,23,42,.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(15,118,110,.16), transparent 34%),
        var(--bg);
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 56px 18px;
    }

    header {
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 6vw, 58px);
      letter-spacing: -0.06em;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 26px;
    }

    .card {
      display: block;
      min-height: 210px;
      padding: 22px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 60px rgba(15,23,42,.12);
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      margin-bottom: 18px;
      font-size: 25px;
      background: #dbeafe;
    }

    .card:nth-child(2) .icon {
      background: #f7dfc9;
    }

    .card:nth-child(3) .icon {
      background: #ccfbf1;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
      letter-spacing: -0.03em;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    .footer {
      margin-top: 26px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.6);
      border: 1px solid rgba(255,255,255,.8);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 780px) {
      .grid {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 34px;
      }

      .card {
        min-height: 160px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>简单小工具</h1>
      <p>这里放一些可以直接打开使用的小工具。选择一个进入即可。</p>
    </header>

    <section class="grid">
      <a class="card" href="daily-cost.html">
        <div class="icon">💰</div>
        <h2>电子产品日均金额计算器</h2>
        <div class="desc">记录电子产品价格和购买日期，自动计算已使用天数、日均金额和总投入。</div>
      </a>

      <a class="card" href="novel-practice.html">
        <div class="icon">✍️</div>
        <h2>每日小说场景练习</h2>
        <div class="desc">每天生成三个小说场景素材，三选一练习，并查看历史片段。</div>
      </a>

      <a class="card" href="song-analyzer.html">
        <div class="icon">🎧</div>
        <h2>歌曲生词与语法分析器</h2>
        <div class="desc">输入歌词，自动分析生词候选、出现行数和常见语法点。</div>
      </a>
    </section>

    <div class="footer">
      提示：这些工具的数据大多保存在当前浏览器本地。换设备或清理浏览器数据前，记得在工具里导出备份。
    </div>
  </main>
</body>
</html>
